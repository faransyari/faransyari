{% macro avatar(url, name, size='md') -%}
  <span class="avatar avatar-{{ size }}" data-initial="{{ (name or '?')[0] | upper }}">
    {%- if url %}<img src="{{ url | img }}" alt="" loading="lazy" onerror="this.remove()">{% endif -%}
  </span>
{%- endmacro %}

{% macro badges(verified, private) -%}
  {%- if verified %}<span class="badge badge-verified" title="Verified">Verified</span>{% endif -%}
  {%- if private %}<span class="badge" title="Private account">Private</span>{% endif -%}
{%- endmacro %}

{% macro limit_select(name='limit', selected=20) -%}
  <select name="{{ name }}" aria-label="How many followers">
    {% for n in [10, 20, 50, 100, 200, 500] if n <= max_followers %}
      <option value="{{ n }}" {% if n == selected %}selected{% endif %}>{{ n }} latest</option>
    {% endfor %}
    {% if selected not in [10, 20, 50, 100, 200, 500] %}
      <option value="{{ selected }}" selected>{{ selected }} latest</option>
    {% endif %}
  </select>
{%- endmacro %}
